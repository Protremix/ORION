name: ORION CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: orion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ORION_PG_HOST: localhost
      ORION_PG_PORT: 5432
      ORION_PG_USER: postgres
      ORION_PG_PASSWORD: test
      ORION_PG_DB: orion
      ORION_API_KEY: ci-test-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests (no live)
        run: pytest --tb=short -q -m "not live"

      - name: Run live PostgreSQL tests
        run: pytest tests/unit/test_live_postgres.py -v --tb=short
        env:
          ORION_PG_HOST: localhost
          ORION_PG_PORT: 5432

      - name: Lint
        run: ruff check src/

      - name: Type check
        run: mypy src/ --ignore-missing-imports
