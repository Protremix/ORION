[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orion"
version = "0.6.0"
description = "ORION Physical Intelligence OS"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "ORION Project"}]

dependencies = [
    "asyncpg>=0.29.0",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "live: marks tests requiring live services (deselect with '-m \"not live\"')",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line length handled by formatter
    "E402",   # module import not at top (intentional in some files per Luna conditions)
    "F401",   # unused import (re-exports in __init__.py are intentional)
    "F841",   # unused variable (test fixtures may intentionally not use all vars)
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
# Pragmatic type checking — catches real bugs without blocking on strict annotations
disable_error_code = [
    "assignment",       # None defaults, type narrowing — not actual bugs
    "arg-type",         # Argument type mismatches between similar types
    "union-attr",       # Union member attribute access
    "return-value",     # Return type strictness
    "dict-item",        # Dict entry type variance
    "index",            # Indexing Optional types
    "misc",             # Miscellaneous strict checks
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "simulation*"]
