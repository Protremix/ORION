{
  "version": "3.8",
  "services": {
    "postgres": {
      "image": "postgres:16",
      "environment": {
        "POSTGRES_USER": "postgres",
        "POSTGRES_PASSWORD": "test",
        "POSTGRES_DB": "orion"
      },
      "ports": [
        "5432:5432"
      ],
      "volumes": [
        "orion_pgdata:/var/lib/postgresql/data"
      ]
    },
    "postgres-pgvector": {
      "image": "pgvector/pgvector:pg16",
      "environment": {
        "POSTGRES_USER": "postgres",
        "POSTGRES_PASSWORD": "test",
        "POSTGRES_DB": "orion"
      },
      "ports": [
        "5433:5432"
      ],
      "volumes": [
        "orion_pgvector_data:/var/lib/postgresql/data"
      ]
    }
  },
  "volumes": {
    "orion_pgdata": null,
    "orion_pgvector_data": null
  }
}